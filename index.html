<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon2.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The phone browser bar takes the colour of the top of the page. -->
    <meta name="theme-color" content="#2F7CC4" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Host+Grotesk:wght@300..700&family=Archivo:wght@400;500;600&family=Azeret+Mono:wght@400;500&display=swap" rel="stylesheet">
    <title>Thimeth Sathmika</title>
    <!-- The loader (#boot): the hero's sky blue with a little orb character in the middle, cream with
         forest eyes. Here it is a plain CSS face, so it shows from the first paint, before any script or
         stylesheet; once React is up, Home.jsx mounts the live one (ui/LiveOrb.jsx, WebGL: the eyes
         follow the pointer, glance around and blink) into #boot-orb over it, and the CSS face goes
         (:has). Home fades #boot out and removes it once the hero's sky, ground and fonts are in. -->
    <style>
      #boot { position: fixed; inset: 0; z-index: 70; display: grid; place-items: center; background: #2F7CC4; transition: opacity .55s cubic-bezier(.16, 1, .3, 1); }
      #boot.boot-done { opacity: 0; pointer-events: none; }
      #boot-orb { display: grid; width: 112px; height: 112px; }
      #boot-orb > * { grid-area: 1 / 1; }
      #boot-orb:has([data-slot="live-orb"]) .boot-face { display: none; }
      /* Sized to match the live orb at rest (its sphere is 94% of the box; eyes from its shader). */
      #boot .boot-face { position: relative; margin: 3%; border-radius: 50%; background: #FBF6EC; }
      #boot .boot-face span { position: absolute; top: 37%; width: 5.4%; height: 18%; border-radius: 999px; background: #14532D; }
      #boot .boot-face span:first-child { left: 33.3%; }
      #boot .boot-face span:last-child { left: 61.3%; }
      @media (prefers-reduced-motion: reduce) { #boot { transition: none; } }
    </style>
  </head>
  <body>
    <div id="boot" role="status" aria-label="Loading">
      <div id="boot-orb" aria-hidden="true">
        <div class="boot-face"><span></span><span></span></div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="./src/main.jsx"></script>
  </body>
</html>
