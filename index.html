<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/thimeth-sathmika/icon2.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The phone browser bar takes the colour of the top of the page. -->
    <meta name="theme-color" content="#2F7CC4" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Host+Grotesk:wght@300..700&family=Archivo:wght@400;500;600&family=Azeret+Mono:wght@400;500&display=swap" rel="stylesheet">
    <title>Thimeth Sathmika</title>
    <!-- The loader (#boot): sky blue with a squiggly progress line, from the first paint
         until the hero's sky, ground and fonts are in (Home.jsx fills the line through --p, then fades
         it out and removes it). Styled here, so it shows before any script or stylesheet has loaded. -->
    <style>
      #boot { position: fixed; inset: 0; z-index: 70; display: grid; place-items: center; background: #2F7CC4; color: #FBF6EC; transition: opacity .55s cubic-bezier(.16, 1, .3, 1); }
      #boot.boot-done { opacity: 0; pointer-events: none; }
      #boot .boot-line { display: block; width: min(240px, 60vw); height: auto; overflow: visible; fill: none; stroke: #FBF6EC; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; }
      #boot .boot-track { opacity: .25; }
      /* The fill is the same squiggle drawn up to --p of its length (pathLength="1"). */
      #boot .boot-fill { stroke-dasharray: 1 1; stroke-dashoffset: calc(1 - var(--p, .08)); transition: stroke-dashoffset .45s cubic-bezier(.16, 1, .3, 1); }
      @media (prefers-reduced-motion: reduce) { #boot, #boot .boot-fill { transition: none; } }
    </style>
    <script type="module" crossorigin src="/thimeth-sathmika/assets/main-DDbDCcQO.js"></script>
    <link rel="modulepreload" crossorigin href="/thimeth-sathmika/assets/Footer-Vbdsqb2a.js">
    <link rel="stylesheet" crossorigin href="/thimeth-sathmika/assets/Footer-BEH-DJC2.css">
  </head>
  <body>
    <div id="boot" role="status" aria-label="Loading">
      <svg class="boot-line" viewBox="0 0 240 14" aria-hidden="true">
        <path class="boot-track" d="M0 7q5-5 10 0t10 0t10 0t10 0t10 0t10 0t10 0t10 0t10 0t10 0t10 0t10 0t10 0t10 0t10 0t10 0t10 0t10 0t10 0t10 0t10 0t10 0t10 0t10 0" />
        <path class="boot-fill" pathLength="1" d="M0 7q5-5 10 0t10 0t10 0t10 0t10 0t10 0t10 0t10 0t10 0t10 0t10 0t10 0t10 0t10 0t10 0t10 0t10 0t10 0t10 0t10 0t10 0t10 0t10 0t10 0" />
      </svg>
    </div>
    <div id="root"></div>
  </body>
</html>
