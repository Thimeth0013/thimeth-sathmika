    <title>Thimeth Sathmika</title>
    <!-- The loader (#boot): the hero's sky gradient (the phone's on phones) with a small cream spinner,
         plain HTML and CSS here, so it shows and spins from the first paint, before any script (a
         transform animation, which the browser runs off the main thread). Kept simple on purpose: the
         clouds are the site's highlight, so they are saved for the hero. The spinner shows only after a
         moment, so a fast load never flashes it. When the hero is ready Home.jsx adds .boot-done (it fades
         into the hero) and removes #boot. -->
    <style>
      #boot { position: fixed; inset: 0; z-index: 70; display: grid; place-items: center; background: linear-gradient(#216FB4, #317CC0 25%, #5499DA 55%, #A1C8FD 92%); transition: opacity .5s cubic-bezier(.4, 0, .2, 1); }
      #boot.boot-done { opacity: 0; pointer-events: none; }
      #boot .boot-spin { width: 28px; height: 28px; border-radius: 50%; border: 2.5px solid rgb(251 246 236 / .3); border-top-color: #FBF6EC;
        animation: boot-show .3s ease-out .35s both, boot-spin .8s linear infinite; }
      @keyframes boot-spin { to { transform: rotate(1turn); } }
      @keyframes boot-show { from { opacity: 0; } }
      @media (max-width: 767px) { #boot { background: linear-gradient(#0056D2, #0462DD 25%, #1275F0 55%, #43A5FC 92%); } }
      /* Night: the same loader under a night sky. */
      /* The loader matches the hero sky for the time of day (data-sky, set above). */
      [data-sky="morning"] #boot { background: linear-gradient(#3C77B8, #6A9BD2 35%, #B6C6DE 70%, #F2CDBE 100%); }
      [data-sky="evening"] #boot { background: linear-gradient(#2A3A6E, #66639A 30%, #D69B7E 60%, #FAC85A 100%); }
      [data-sky="night"] #boot { background: linear-gradient(#060B18, #0B1530 45%, #16244A 100%); }
    </style>
