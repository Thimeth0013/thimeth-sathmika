<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon2.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The phone browser bar takes the colour of the top of the page. -->
    <meta name="theme-color" content="#ffffff" data-light="#ffffff" data-dark="#0C1321" />
    <!-- Light or dark: the saved choice (the Enderman in the footer switches it), else the system's;
         set before the first paint so the page never flashes the wrong one (src/lib/theme.js). -->
    <script>
      (function () {
        var t;
        try { t = localStorage.getItem('theme'); } catch (e) {}
        if (t !== 'dark' && t !== 'light') t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = t;
        var bar = document.querySelector('meta[name="theme-color"]');
        if (bar) bar.setAttribute('content', bar.dataset[t]);
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Host+Grotesk:wght@300..700&family=Archivo:wght@400;500;600&family=Azeret+Mono:wght@400;500&display=swap" rel="stylesheet">
    <title>All work · Thimeth Sathmika</title>
  </head>

    <div id="root"></div>
    <script type="module" src="../src/work.jsx"></script>
  </body>
</html>
